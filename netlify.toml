# Configuration Netlify : rien à régler dans l'interface, tout est ici.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Aperçus (branche refonte-blog, propositions de modification) :
# les brouillons sont visibles pour la relecture, et rien n'est indexé par Google.
[context.branch-deploy.environment]
  SHOW_DRAFTS = "true"
  NOINDEX = "true"

[context.deploy-preview.environment]
  SHOW_DRAFTS = "true"
  NOINDEX = "true"
