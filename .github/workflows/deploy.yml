# Publie le site sur GitHub Pages à chaque envoi sur la branche main.
# Réglage unique à faire dans GitHub : Settings → Pages → Source = « GitHub Actions ».
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compiler le site
        run: npm run build
        env:
          # Phase de relecture : les brouillons sont visibles et rien n'est indexé par Google.
          # Le jour de la bascule de buddandfly.com, passer ces deux valeurs à "false".
          SHOW_DRAFTS: "true"
          NOINDEX: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
