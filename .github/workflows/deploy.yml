# Publie le site sur GitHub Pages à chaque envoi sur la branche main.
# Réglage unique à faire dans GitHub : Settings → Pages → Source = « GitHub Actions ».
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compiler le site
        run: npm run build
        env:
          # Production : seuls les contenus « valide » sont publiés, et le site est indexé.
          SHOW_DRAFTS: "false"
          NOINDEX: "false"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Prévient Bing et les autres moteurs IndexNow des pages modifiées (non bloquant).
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Lancement manuel (workflow_dispatch) : toutes les pages ; sinon celles modifiées depuis 3 jours.
      - run: sleep 60 && node scripts/indexnow.mjs ${{ github.event_name == 'workflow_dispatch' && '0' || '3' }}
